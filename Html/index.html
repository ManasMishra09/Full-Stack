<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        async function add(){
            const a = document.getElementById("first").value;
            const b = document.getElementById("second").value;

            const res = await fetch("http://localhost:3000/sum/", {
                 method: "POST",
                 headers:{
                    "Content-Type": "application/json"
                 },
                 body: JSON.stringify({
                    a: a,
                    b: b
                 })
            });
            const json = await res.json();  
            document.getElementById("response").innerHTML = json.ans;
        }
    </script>
</head>
<body>
    <input type ="text" id="first" placeholder="Enter the first number">
    <input type ="text" id="second" placeholder="Enter the second number">

        <button onclick="add()">Add</button>
        <button onclick="sub()">Subtract</button>
        <button onclick="div()">Division</button>
        <button onclick="mul()">Multiply</button>
        
        <div id="response"></div>
</body>
</html>
